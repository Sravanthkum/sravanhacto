<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SuperAdmin Access — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --card-width: 420px;
      --purple-1: #5c5cff;
      --purple-2: #4b6be0;
      --muted: #4312be;
    }
    html,body{
      height:100%;
      margin:0;
      font-family: 'Poppins', system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, #c17fff 0%, #527ab6 50%, #6035a6 100%);
    }
    .wrap { min-height:100%; display:flex; align-items:center; justify-content:center; padding:48px 20px; }
    .login-card {
      width: min(var(--card-width), 92%);
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(16,24,40,0.18);
      padding: 34px 36px;
      text-align: center;
    }
    .logo { width: 60px; height: 60px; margin: 0 auto 10px; display:flex; align-items:center; justify-content:center; border-radius:50%; background: linear-gradient(180deg, rgba(124,92,255,0.12), rgba(106,75,224,0.08)); }
    .title { font-weight:700; color:#5f3bd6; font-size:1.6rem; line-height:1; }
    .subtitle { color:var(--muted); margin-top:8px; font-size:.95rem; }
    form { margin-top: 22px; text-align:left; }
    .form-label { font-weight:600; font-size:.95rem; color:#444; }
    .form-control { border-radius: 10px; height:48px; padding:12px 14px; border:1px solid #eee; font-size:.95rem; }
    .form-control:focus{ outline: none; box-shadow: 0 0 0 4px rgba(102,78,255,0.08); border-color: rgba(102,78,255,0.35); }
    .btn-gradient { width:100%; border-radius:12px; padding:12px 18px; border: none; font-weight:600; font-size:1rem; margin-top:14px; background: linear-gradient(90deg, #3d17e7 0%, #3d0ac1 100%); color:#fff; }
    .links { margin-top:16px; text-align:center; color:var(--muted); font-size:.95rem; }
    .links a { color:#2a63ff; text-decoration:none; font-weight:600; }
    .back-link { display:flex; align-items:center; gap:8px; justify-content:center; margin-top:10px; color:#4b5bbf; text-decoration:none; font-weight:600; }
    @media (max-width:420px){ .login-card { padding: 22px;} .title { font-size:1.3rem; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="login-card">
      <div class="logo" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L4 5v5c0 5.25 3.75 10 8 12 4.25-2 8-6.75 8-12V5l-8-3z" stroke="#6b4de8" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
          <path d="M12 11.5v2" stroke="#6b4de8" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="9.2" r="1.2" fill="#6b4de8"/>
        </svg>
      </div>
      <div class="title">SuperAdmin<br><span style="display:block;margin-top:6px;">Access</span></div>
      <div class="subtitle">Administrator login required</div>

      <form id="loginForm">
  <div class="mb-3 mt-4">
    <label for="username" class="form-label">Username</label>
    <input id="username" class="form-control" type="text" placeholder="Admin username">
  </div>
  <div class="mb-3">
    <label for="password" class="form-label">Password</label>
    <input id="password" class="form-control" type="password" placeholder="Admin password">
  </div>
  <button class="btn-gradient" type="submit">Login as SuperAdmin</button>

  <div class="links">
    Don't have an account? <a href="super.reg.html">Register here</a>
    <div style="height:6px"></div>
    <a href="index.html" class="back-link">← Back to Main Site</a>
  </div>
</form>

    </div>
  </div>


 
</body>
</html>
